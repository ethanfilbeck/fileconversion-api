name = "fileconversion-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Serves public/ (the tools UI) at the root; unmatched paths fall through to the Worker.
[assets]
directory = "./public"

[vars]
# Comma-separated origins allowed to call the API from other sites (e.g. your Pages SEO site).
# The UI in public/ is same-origin and needs nothing here.
ALLOWED_ORIGINS = ""
# Supabase project used for sign-in. Both values are public (safe in the browser).
SUPABASE_URL = "https://nihvdpzghevumcgpvkxi.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_EYNdl4jUpzyO-4m6pufPCg_xkA7tAYQ"
# Stripe price ids (public). These are TEST-mode prices; swap for the live ones
# (Stripe → Product catalog, live mode) together with a live secret key when launching.
STRIPE_PRICE_PRO_MONTHLY = "price_1UXasnBu99obsSyFDHbQCnvs"       # $12 / month
STRIPE_PRICE_PRO_YEARLY = "price_1UXasxBu99obsSyFEGEZjvn4"        # $99 / year
STRIPE_PRICE_BUSINESS_MONTHLY = "price_1UXatZBu99obsSyFdVZ3z7DH"  # $29 / month
STRIPE_PRICE_BUSINESS_YEARLY = "price_1UXatlBu99obsSyFizBFOn9b"   # $249 / year
# Secrets (set in Cloudflare → Worker → Settings → Variables and Secrets, never here):
#   SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fileconversion-uploads"

[[kv_namespaces]]
binding = "DB"
id = "c65de6274cf24ceabe8dcfde8116fa2f"
