<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDFToolsHub: Merge, Split &amp; Compress PDFs</title>
<meta name="description" content="Free online PDF tools: merge PDFs, split pages, and compress files. No signup." />
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #14171f; --muted: #5d6573;
    --line: #dde1e7; --accent: #d93a2b; --accent-ink: #fff; --ok: #1d7a46;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { max-width: 760px; margin: 0 auto; padding: 32px 16px 8px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 10px 16px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; padding: 20px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 32px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); background: #fff6f5; }
  .drop strong { color: var(--ink); }
  ul.files { list-style: none; padding: 0; margin: 16px 0 0; }
  ul.files li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
  ul.files li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.files li .size { color: var(--muted); }
  ul.files button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; }
  .opts { margin-top: 16px; display: grid; gap: 10px; }
  .opts label { font-size: 14px; color: var(--muted); }
  .opts input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .go { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; cursor: pointer; }
  .go:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 14px; min-height: 24px; font-size: 14px; }
  .status.err { color: var(--accent); }
  .status.ok { color: var(--ok); }
  .status a { color: inherit; font-weight: 700; }
  .bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .account { font-size: 14px; color: var(--muted); text-align: right; padding-top: 6px; }
  .link { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
  .signin { display: grid; gap: 10px; margin-top: 4px; }
  .signin input { padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--card); color: var(--ink); }
  .row { display: flex; gap: 8px; }
  .row .go { margin-top: 0; }
  .go.secondary { background: none; border: 1px solid var(--line); color: var(--ink); }
  .muted { color: var(--muted); font-size: 14px; }
  footer { max-width: 760px; margin: 0 auto; padding: 16px; color: var(--muted); font-size: 13px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1a1d24; --ink: #eef0f3; --muted: #9aa2af; --line: #2c313b; --ok: #4cc37f; }
    .drop.over, .drop:hover { background: #24191a; }
    ul.files button { background: var(--card); color: var(--ink); }
    .opts input[type=text] { background: var(--card); color: var(--ink); }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div>
      <h1>PDF<span>Tools</span>Hub</h1>
      <p>Merge, split and compress PDFs. Tool files are processed and returned right away, never stored.</p>
    </div>
    <div class="account" id="account"></div>
  </div>
</header>

<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-tool="merge" aria-selected="true">Merge</button>
    <button role="tab" data-tool="split" aria-selected="false">Split</button>
    <button role="tab" data-tool="compress" aria-selected="false">Compress</button>
    <button role="tab" data-tool="files" aria-selected="false">My files</button>
  </div>

  <section class="card" id="toolCard">
    <div class="drop" id="drop" tabindex="0">
      <strong id="dropTitle">Drop PDFs here</strong><br />or click to choose files
      <input type="file" id="input" accept="application/pdf,.pdf" hidden />
    </div>
    <ul class="files" id="list"></ul>

    <div class="opts" id="splitOpts" hidden>
      <label><input type="radio" name="mode" value="range" checked /> Extract pages</label>
      <input type="text" id="pages" placeholder="e.g. 1-3, 5, 8-" />
      <label><input type="radio" name="mode" value="each" /> Split every page into its own PDF (ZIP)</label>
    </div>

    <button class="go" id="go" disabled>Merge PDFs</button>
    <div class="status" id="status" role="status"></div>
    <button class="go secondary" id="save" hidden>Save result to My files</button>
  </section>

  <section class="card" id="filesCard" hidden>
    <div id="signedOut">
      <p class="muted">Sign in to keep files in your account. Only you can see them.</p>
      <form class="signin" id="signinForm">
        <input type="email" id="email" placeholder="Email" autocomplete="email" required />
        <input type="password" id="password" placeholder="Password (8+ characters)" autocomplete="current-password" minlength="8" required />
        <div class="row">
          <button class="go" type="submit" data-action="in">Sign in</button>
          <button class="go secondary" type="submit" data-action="up">Create account</button>
        </div>
      </form>
    </div>
    <div id="signedIn" hidden>
      <button class="go" id="uploadBtn">Upload a file</button>
      <input type="file" id="uploadInput" hidden />
      <ul class="files" id="myFiles"></ul>
    </div>
    <div class="status" id="filesStatus" role="status"></div>
  </section>
</main>

<footer>Limits: 10MB per file, 25MB per job, 500 pages.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const MAX_FILE = 10 * 1024 * 1024;
const TOOLS = {
  merge:    { label: "Merge PDFs",    multi: true,  min: 2, title: "Drop 2 or more PDFs here" },
  split:    { label: "Split PDF",     multi: false, min: 1, title: "Drop a PDF here" },
  compress: { label: "Compress PDF",  multi: false, min: 1, title: "Drop a PDF here" },
};
let tool = "merge";
let files = [];

const $ = (id) => document.getElementById(id);
const input = $("input"), drop = $("drop"), list = $("list"), go = $("go"), status = $("status");

function fmt(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.ceil(n / 1024) + " KB"; }

// Plain text by default so filenames in error messages can't inject HTML.
function setStatus(text, kind = "", asHtml = false) {
  status.className = "status " + kind;
  if (asHtml) status.innerHTML = text; else status.textContent = text;
}

function render() {
  const t = TOOLS[tool];
  list.innerHTML = "";
  files.forEach((f, i) => {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "name"; name.textContent = f.name;
    const size = document.createElement("span");
    size.className = "size"; size.textContent = fmt(f.size);
    li.append(name, size);
    if (t.multi) {
      li.append(btn("↑", () => move(i, -1), i === 0), btn("↓", () => move(i, 1), i === files.length - 1));
    }
    li.append(btn("✕", () => { files.splice(i, 1); render(); }));
    list.append(li);
  });
  go.disabled = files.length < t.min;
  go.textContent = t.label;
  $("dropTitle").textContent = t.title;
  $("splitOpts").hidden = tool !== "split";
  input.multiple = t.multi;
}

function btn(text, onClick, disabled = false) {
  const b = document.createElement("button");
  b.textContent = text; b.disabled = disabled; b.onclick = onClick;
  return b;
}

function move(i, d) { [files[i], files[i + d]] = [files[i + d], files[i]]; render(); }

function add(fileList) {
  setStatus("");
  for (const f of fileList) {
    if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") { setStatus(`"${f.name}" isn't a PDF.`, "err"); continue; }
    if (f.size > MAX_FILE) { setStatus(`"${f.name}" is over 10MB.`, "err"); continue; }
    if (TOOLS[tool].multi) files.push(f); else files = [f];
  }
  render();
}

document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
    const isFiles = b.dataset.tool === "files";
    $("toolCard").hidden = isFiles;
    $("filesCard").hidden = !isFiles;
    if (isFiles) { refreshFiles(); return; }
    tool = b.dataset.tool;
    if (!TOOLS[tool].multi) files = files.slice(0, 1);
    setStatus(""); $("save").hidden = true; render();
  };
});

drop.onclick = () => input.click();
drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
input.onchange = () => { add(input.files); input.value = ""; };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };

go.onclick = async () => {
  const fd = new FormData();
  files.forEach((f) => fd.append("file", f));
  if (tool === "split") {
    const mode = document.querySelector('input[name=mode]:checked').value;
    fd.append("mode", mode);
    fd.append("pages", $("pages").value);
  }
  go.disabled = true;
  setStatus("Processing…");
  $("save").hidden = true;
  try {
    const res = await fetch(`/api/${tool}`, { method: "POST", body: fd });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `Request failed (${res.status})`);
    }
    const blob = await res.blob();
    lastResult = { blob, name: "" };
    const cd = res.headers.get("Content-Disposition") || "";
    const name = (cd.match(/filename="([^"]+)"/) || [])[1] || "result.pdf";
    lastResult.name = name;
    $("save").hidden = !session;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();

    let msg = `Done. <a href="${url}" download="${name}">Download ${name}</a>`;
    if (tool === "compress") {
      const before = +res.headers.get("X-Original-Size"), after = +res.headers.get("X-Compressed-Size");
      msg += after < before
        ? ` (${fmt(before)} → ${fmt(after)}, ${Math.round((1 - after / before) * 100)}% smaller)`
        : " (this file was already optimized, so it's unchanged)";
    }
    setStatus(msg, "ok", true); // name is sanitized server-side to [A-Za-z0-9._-]
  } catch (err) {
    setStatus(err.message, "err");
  } finally {
    go.disabled = files.length < TOOLS[tool].min;
  }
};

// ---------- Accounts (Supabase) & My files ----------
let sb = null, session = null, lastResult = null;

async function initAuth() {
  try {
    const cfg = await (await fetch("/api/config")).json();
    if (!cfg.supabaseUrl || !cfg.supabaseKey || !window.supabase) return renderAccount();
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
    session = (await sb.auth.getSession()).data.session;
    sb.auth.onAuthStateChange((_e, s) => { session = s; renderAccount(); refreshFiles(); });
  } catch { /* accounts unavailable; tools still work */ }
  renderAccount();
}

function renderAccount() {
  const el = $("account");
  el.textContent = "";
  if (!sb) return;
  if (session) {
    el.append(document.createTextNode(session.user.email + " · "));
    const out = document.createElement("button");
    out.className = "link"; out.textContent = "Sign out";
    out.onclick = () => sb.auth.signOut();
    el.append(out);
  } else {
    const inBtn = document.createElement("button");
    inBtn.className = "link"; inBtn.textContent = "Sign in";
    inBtn.onclick = () => document.querySelector('[data-tool="files"]').click();
    el.append(inBtn);
  }
  $("signedOut").hidden = !!session;
  $("signedIn").hidden = !session;
}

function filesStatus(text, kind = "") { const s = $("filesStatus"); s.className = "status " + kind; s.textContent = text; }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${session.access_token}` } });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `Request failed (${res.status})`);
  }
  return res;
}

let submitAction = "in";
document.querySelectorAll("#signinForm [data-action]").forEach((b) => b.onclick = () => submitAction = b.dataset.action);
$("signinForm").onsubmit = async (e) => {
  e.preventDefault();
  if (!sb) return filesStatus("Accounts aren't set up yet.", "err");
  const email = $("email").value.trim(), password = $("password").value;
  filesStatus(submitAction === "up" ? "Creating account…" : "Signing in…");
  const { data, error } = submitAction === "up"
    ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin } })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) return filesStatus(error.message, "err");
  if (submitAction === "up" && !data.session) return filesStatus("Check your email to confirm your account, then sign in.", "ok");
  filesStatus("");
};

async function refreshFiles() {
  const ul = $("myFiles");
  if (!session || $("filesCard").hidden) return;
  try {
    const { files: mine } = await (await api("/api/files")).json();
    ul.textContent = "";
    if (!mine.length) { const li = document.createElement("li"); li.textContent = "No files yet."; ul.append(li); return; }
    for (const f of mine) {
      const li = document.createElement("li");
      const name = document.createElement("span"); name.className = "name"; name.textContent = f.name;
      const size = document.createElement("span"); size.className = "size"; size.textContent = fmt(f.size);
      li.append(name, size, btn("Download", () => download(f)), btn("Delete", () => remove(f)));
      ul.append(li);
    }
  } catch (err) { filesStatus(err.message, "err"); }
}

async function download(f) {
  try {
    const blob = await (await api(`/api/files/${f.id}`)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = f.name; a.click();
  } catch (err) { filesStatus(err.message, "err"); }
}

async function remove(f) {
  try { await api(`/api/files/${f.id}`, { method: "DELETE" }); refreshFiles(); }
  catch (err) { filesStatus(err.message, "err"); }
}

async function saveFile(file) {
  const fd = new FormData(); fd.append("file", file);
  await api("/api/files", { method: "POST", body: fd });
}

$("uploadBtn").onclick = () => $("uploadInput").click();
$("uploadInput").onchange = async () => {
  const f = $("uploadInput").files[0]; $("uploadInput").value = "";
  if (!f) return;
  if (f.size > MAX_FILE) return filesStatus("Files must be under 10MB.", "err");
  filesStatus("Uploading…");
  try { await saveFile(f); filesStatus("Saved.", "ok"); refreshFiles(); }
  catch (err) { filesStatus(err.message, "err"); }
};

$("save").onclick = async () => {
  if (!lastResult || !session) return;
  $("save").disabled = true;
  try { await saveFile(new File([lastResult.blob], lastResult.name)); setStatus("Saved to My files.", "ok"); $("save").hidden = true; }
  catch (err) { setStatus(err.message, "err"); }
  finally { $("save").disabled = false; }
};

render();
initAuth();
</script>
</body>
</html>
